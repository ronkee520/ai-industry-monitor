name: Update & Deploy AI Industry Monitor

on:
  schedule:
    # 北京时间每日 09:00 (UTC+8 → UTC 01:00)，持续积累价格历史曲线。
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "跳过网络采集（仅用 local/manual 数据构建）"
        type: boolean
        default: false
      verbose:
        description: "输出详细日志"
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - "config/**"
      - "data/manual/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - ".github/workflows/update-deploy.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run data pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SKIP_FETCH: ${{ inputs.skip_fetch }}
        run: |
          if [[ "$SKIP_FETCH" == "true" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "使用仓库内的快照构建站点"
            python scripts/run_all.py --project-root . --skip-fetch --verbose
          else
            echo "采集公开数据并构建站点"
            python scripts/run_all.py --project-root . --verbose
          fi

      - name: Verify build output
        run: |
          echo "检查 _site/ 生成完整性..."
          required=(
            "_site/index.html"
            "_site/token/index.html"
            "_site/business/index.html"
            "_site/compute/index.html"
            "_site/supply-chain/index.html"
            "_site/investment/index.html"
            "_site/methodology/index.html"
            "_site/api/index.json"
            "_site/api/dashboard.json"
            "_site/api/overview.json"
            "_site/api/token-pricing.json"
            "_site/api/business.json"
            "_site/api/gpu-pricing.json"
            "_site/api/supply-chain.json"
            "_site/api/investment.json"
            "_site/api/history.json"
            "_site/api/health.json"
            "_site/.nojekyll"
            "_site/app.js"
            "_site/styles.css"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "  ✗ 缺失: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing 个必需文件缺失"
            exit 1
          fi
          echo "  全部 ${#required[@]} 个文件检查通过"

          # 检查模板变量
          echo "检查模板变量替换..."
          if grep -r '{{ROOT_PREFIX}}\|{{ASSET_PREFIX}}\|{{ASSET_VERSION}}' _site/ -l 2>/dev/null; then
            echo "ERROR: 存在未替换的模板变量"
            exit 1
          fi
          echo "  模板变量检查通过"

          # 检查外部 CDN
          echo "检查外部 CDN..."
          if grep -rP '(?i)cdn\.|fonts\.googleapis\.com|unpkg\.com|jsdelivr\.net' _site/ -l 2>/dev/null; then
            echo "WARNING: 检测到外部 CDN 引用"
          else
            echo "  无外部 CDN"
          fi

          echo "✓ 构建校验通过"

      # 仅持久化默认分支上实际执行了采集的运行。
      - name: Persist automated data snapshot
        if: >-
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_fetch))
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/automated data/history data/news
          if git diff --cached --quiet; then
            echo "无可持久化的数据变化"
          else
            git commit -m "data: refresh automated snapshot [skip ci]"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # GitHub 可能需要几秒才能通过 API 查到刚上传的产物。
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ || -z "$ARTIFACT_NAME" ]]; then
            echo "::error::Pages artifact outputs are missing."
            exit 1
          fi

          for retry_delay in 0 1 2 4 8 16; do
            sleep "$retry_delay"
            if name=$(timeout 10s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
              --jq 'select(.expired == false) | .name') && [[ "$name" == "$ARTIFACT_NAME" ]]; then
              echo "Pages artifact $name ($ARTIFACT_ID) is available."
              exit 0
            fi
          done

          echo "::error::Pages artifact $ARTIFACT_NAME ($ARTIFACT_ID) is unavailable or expired."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
